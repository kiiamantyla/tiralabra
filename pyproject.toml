[project]
name = "tiralabra"
version = "0.1.0"
description = ""
authors = [
    {name = "Kiia Mäntylä",email = "kiia.mantyla@helsinki.fi"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask (>=3.1.3,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pylint (>=4.1.3,<5.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "coverage (>=7.17.2,<8.0.0)",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.pylint.main]
init-hook = "import sys; sys.path.append('./src')"
